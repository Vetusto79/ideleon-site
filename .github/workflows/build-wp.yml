name: Build WordPress migration package

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: bash build-wp-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ideleon-static-theme
          path: ideleon-static-theme.zip
